name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pos_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d pos_platform_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      NODE_ENV: test
      APP_ORIGIN: http://localhost:3000
      JWT_SECRET: test-secret
      JWT_EXPIRES_IN: 1d
      BCRYPT_SALT_ROUNDS: 10
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pos_platform_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Apply Prisma migrations
        run: npx prisma migrate deploy
      - name: Seed database
        run: npx prisma db seed
      - name: Run tests (unit + e2e)
        run: DB_E2E=true npm run test:run

